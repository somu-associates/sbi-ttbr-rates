name: Fetch SBI rates

on:
  schedule:
    # Every hour from 9:30 AM to 5:30 PM IST, Monday to Saturday
    # (04:00-12:00 UTC). SBI issues its first card around 9-10 AM and
    # sometimes revises it during the day; each new card is stored.
    - cron: "0 4-12 * * 1-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-rates
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and save the SBI card
        run: python fetch_rates.py

      - name: Commit new rates
        run: |
          git config user.name  "casomu-rates-bot"
          git config user.email "actions@users.noreply.github.com"
          git add rates pdf_files site
          if git diff --cached --quiet; then
            echo "No new SBI card."
          else
            git commit -m "SBI rates $(TZ=Asia/Kolkata date '+%d.%m.%Y %H:%M') IST"
            git push
          fi
